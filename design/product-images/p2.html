<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>02 为什么需要</title>
<link rel="stylesheet" href="card.css">
</head>
<body>
<div class="card">

  <div class="pg-head">
    <span class="ord">一</span>
    <h2>为什么需要</h2>
  </div>

  <div class="lead">一句话，让 AI 自动获取<em>个性化过滤</em>和<em>编排</em>后的内容清单。粘贴进备忘录，每天直接点链接。</div>

  <div class="compare">
    <div class="col manual">
      <div class="col-h">现在：自己挑</div>
      <div class="steps">
        <div class="step">打开收藏夹，一行行翻</div>
        <div class="step">搜「瑜伽 30 分钟」</div>
        <div class="step">看封面判断靠不靠谱</div>
        <div class="step">排除上个月做过的</div>
        <div class="step">自己排一个顺序</div>
        <div class="step">明天，从头再来一遍</div>
      </div>
    </div>
    <div class="col auto">
      <div class="col-h">用它：说一句</div>
      <div class="steps">
        <div class="step">说出你的需求</div>
        <div class="step">拿到排好的清单</div>
        <div class="step">点链接，直接开始</div>
      </div>
    </div>
  </div>

  <div class="closing">
    <p>避免每天繁琐的手动挑选，<br>节省时间和心力，降低启动成本。</p>
  </div>

  <div class="pg-foot">
    <span class="who">B站私人编排器</span>
    <span>02</span>
  </div>

</div>
</body>
</html>
