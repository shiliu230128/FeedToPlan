<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>04 示例</title>
<link rel="stylesheet" href="card.css">
</head>
<body>
<div class="card">

  <div class="pg-head">
    <span class="ord">举例</span>
    <h2>你可以这样下指令</h2>
  </div>

  <div class="exs">

    <div class="ex">
      <div class="ex-h">示例 1</div>
      <p>帮我编排一个我关注的 up 主、解压助眠、适合晚上练习、适合久坐人群、30min 内的瑜伽跟练周计划</p>
      <div class="tags">
        <span class="tag">关注的 UP 主</span>
        <span class="tag">解压助眠</span>
        <span class="tag">晚上练习</span>
        <span class="tag">久坐人群</span>
        <span class="tag">30min 内</span>
        <span class="tag">瑜伽跟练</span>
        <span class="tag">周计划</span>
      </div>
    </div>

    <div class="ex">
      <div class="ex-h">示例 2</div>
      <p>帮我编排一个适合工作学习听、提升专注、降低焦虑和压力、分早中晚场景的音频周计划</p>
      <div class="tags">
        <span class="tag">工作学习听</span>
        <span class="tag">提升专注</span>
        <span class="tag">降低焦虑</span>
        <span class="tag">分早中晚场景</span>
        <span class="tag">音频</span>
      </div>
    </div>

    <div class="ex">
      <div class="ex-h">示例 3</div>
      <p>帮我查看本周我关注的哪些 up 主有更新，拉取内容列表</p>
      <div class="tags">
        <span class="tag">关注的 UP 主</span>
        <span class="tag">本周更新</span>
        <span class="tag">内容列表</span>
      </div>
    </div>

  </div>

  <div class="pg-foot">
    <span class="who">B站私人编排器</span>
    <span>04</span>
  </div>

</div>
</body>
</html>
