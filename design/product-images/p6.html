<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>06 你可能还想问</title>
<link rel="stylesheet" href="card.css">
</head>
<body>
<div class="card">

  <div class="pg-head">
    <span class="ord">四</span>
    <h2>你可能还想问</h2>
  </div>

  <div class="qa">

    <div class="item">
      <div class="q">我 B 站有收藏夹和稍后再看，为什么还要这个？</div>
      <div class="a">收藏夹解决的是「先存着」，不解决「今天练哪个」。用的时候还得自己再筛一遍，反而增加了使用时的启动成本。</div>
    </div>

    <div class="item">
      <div class="q">要装 Python、要复制 Cookie，会不会卡在半路？</div>
      <div class="a">README 是照着不懂技术的人也能跑通写的。每一步都写了你应该在屏幕上看到什么，包括 Cookie 去哪里复制、复制出来的内容长什么样、怎么粘贴、怎么确认配置成功。</div>
    </div>

    <div class="item">
      <div class="q">Cookie 给出去安全吗？</div>
      <div class="a">你的 Cookie 是加密储存在本地的，几乎没有泄露风险。</div>
    </div>

  </div>

  <div class="pg-foot">
    <span class="who">B站私人编排器</span>
    <span>06</span>
  </div>

</div>
</body>
</html>
