<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>01 封面</title>
<link rel="stylesheet" href="card.css">
</head>
<body>
<div class="card cover">

  <div class="kicker">B站内容编排工具</div>

  <h1>B站<br>私人编排器</h1>

  <p class="sub">一句话说清你要什么，<br>这一周要练的、要听的、要看的，<br>它替你排好。</p>

  <div class="week">
    <div class="day"><div class="dow">一</div><div class="what">瑜伽</div><div class="len">30′</div></div>
    <div class="day"><div class="dow">二</div><div class="what">音频</div><div class="len">45′</div></div>
    <div class="day"><div class="dow">三</div><div class="what">拉伸</div><div class="len">20′</div></div>
    <div class="day today"><div class="dow">四</div><div class="what">助眠</div><div class="len">60′</div></div>
    <div class="day"><div class="dow">五</div><div class="what">力量</div><div class="len">40′</div></div>
    <div class="day"><div class="dow">六</div><div class="what">科普</div><div class="len">35′</div></div>
    <div class="day"><div class="dow">日</div><div class="what">疗愈</div><div class="len">50′</div></div>
  </div>

  <p class="claim">收藏夹解决的是「先存着」，<br>不解决「今天练哪个」。</p>

</div>
</body>
</html>
